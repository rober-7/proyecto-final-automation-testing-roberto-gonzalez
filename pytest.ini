[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# El reporte HTML se genera en cada ejecucion (autocontenido: incluye estilos y capturas)
addopts = -v --strict-markers --html=reports/reporte.html --self-contained-html
markers =
    ui: pruebas de interfaz web con Selenium (tests/ui)
    api: pruebas de API con Requests (tests/api)

# Logging: nivel minimo capturado por test (se muestra en el reporte HTML)
log_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S

# Logging: archivo con el detalle completo de la ejecucion
log_file = reports/logs/execution.log
log_file_level = DEBUG
log_file_mode = w
log_file_format = %(asctime)s [%(levelname)-7s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Logging en consola (desactivado por defecto; activar con --log-cli-level=INFO)
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
